# 매일 시세를 수집해 부모님용 화면(GitHub Pages)을 갱신한다.
# 수집 DB는 저장소에 올리기엔 커서 Actions 캐시에 보관하고, 캐시가 없으면 두 달 치를 새로 받는다.
name: 시세 갱신

on:
  schedule:
    - cron: "0 22 * * *"  # 한국 시간 07:00
    - cron: "0 9 * * *"   # 한국 시간 18:00
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: sise
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 지난 수집 DB 불러오기
        uses: actions/cache/restore@v4
        with:
          path: data
          key: db-${{ github.run_id }}
          restore-keys: db-

      - name: 시세 수집
        env:
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          if [ -f data/prices.db ]; then DAYS=4; else DAYS=62; fi
          python collector.py --days "$DAYS" --no-excel --keep-days 70

      - name: 수집 DB 보관
        if: always() && hashFiles('data/prices.db') != ''
        uses: actions/cache/save@v4
        with:
          path: data
          key: db-${{ github.run_id }}

      - name: 화면 파일 만들기
        run: python export_static.py --out site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
